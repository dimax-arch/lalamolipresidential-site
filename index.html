<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palacio Presidencial — Sala de Operaciones</title>
  <link rel="icon" type="image/svg+xml" href="parthenon26.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1d1815" />
  <!-- Aplica el tema guardado antes del primer render para evitar un destello -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('palacio_theme');
        if (stored === 'light' || stored === 'dark') theme = stored;
        else if (matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) { /* sin localStorage */ }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- PWA instalable en iOS ("Agregar a inicio") -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Palacio" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
